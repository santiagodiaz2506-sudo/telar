<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c0c0c" />
    <meta name="description" content="Bandeja de entrada y consola de agentes de Telar." />
    <title>Telar</title>
    <script>
      // Aplica el tema guardado antes del primer pintado para que no haya
      // un destello blanco al recargar.
      try {
        var stored = localStorage.getItem('telar-theme') || 'dark'
        var dark =
          stored === 'dark' ||
          (stored === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', dark ? '#0c0c0c' : '#ffffff')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
