[project]
name = "telar"
version = "0.1.0"
description = "Plataforma open source de agentes conversacionales para WhatsApp Cloud API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "psycopg[binary,pool]>=3.2",
    "cryptography>=43",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langgraph>=0.2.50",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain-anthropic>=0.3",
]

[project.optional-dependencies]
openai = ["langchain-openai>=0.2"]
ollama = ["langchain-ollama>=0.2"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["telar"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
