services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: telar
      POSTGRES_PASSWORD: telar
      POSTGRES_DB: telar
    volumes:
      - telar_db:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telar"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://telar:telar@db:5432/telar
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  # Solo para desarrollo: expone el webhook sin abrir puertos ni tener IP fija.
  # En producción usa tu propio reverse proxy con TLS.
  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - api
    profiles: ["dev"]

volumes:
  telar_db:
